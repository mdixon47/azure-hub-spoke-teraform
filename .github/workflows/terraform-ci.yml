name: terraform-ci

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars.example"
      - "**/*.tfvars"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"
      - ".checkov.yaml"
  push:
    branches: [main]
    paths:
      - "**/*.tf"

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: "1.9.5"
  TFLINT_VERSION: "v0.52.0"
  TF_IN_AUTOMATION: "true"
  # Opt JS actions (checkout, download-artifact, etc.) into Node.js 24 to
  # silence the Node.js 20 deprecation warning. Node 20 is removed from
  # GitHub-hosted runners on 2026-09-16.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -recursive -check -diff

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: tflint --init
      - run: tflint --recursive --config="$(pwd)/.tflint.hcl" --format=compact

  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    needs: [fmt, validate, tflint]
    if: github.event_name == 'pull_request'
    environment: dev
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Open state SA for terraform
        run: |
          # GitHub-hosted runners use dynamic IPs that may egress via IPv6 to
          # Azure Storage endpoints; Storage IP allowlist rules are IPv4-only so
          # a dynamic IP-based approach is unreliable. Instead, temporarily set
          # defaultAction=Allow for the duration of the plan job. Entra ID auth
          # is still enforced on every request, so no anonymous access is possible.
          az storage account update \
            --resource-group "${{ vars.TFSTATE_RG }}" \
            --name "${{ vars.TFSTATE_SA }}" \
            --default-action Allow \
            --output none
          echo "state SA: defaultAction=Allow (will restore in cleanup step)"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init
        # Defense in depth: even after a stable probe, occasional 403s
        # have been seen on the first init attempt. Retry up to 3 times.
        run: |
          for attempt in 1 2 3; do
            if terraform init \
                 -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
                 -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
                 -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
                 -backend-config="key=dev.terraform.tfstate"; then
              exit 0
            fi
            echo "terraform init attempt $attempt failed; waiting 15s"
            sleep 15
          done
          echo "::error::terraform init failed after 3 attempts"
          exit 1
      - name: terraform plan
        env:
          TF_VAR_vm_admin_password: ${{ secrets.VM_ADMIN_PASSWORD }}
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
          TF_VAR_vm_admin_ssh_public_key: ${{ secrets.VM_ADMIN_SSH_PUBLIC_KEY }}
        run: terraform plan -input=false -no-color -out=tfplan
      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ github.run_id }}
          path: tfplan
          retention-days: 7
          if-no-files-found: error
      - name: Restore state SA firewall
        if: always()
        run: |
          az storage account update \
            --resource-group "${{ vars.TFSTATE_RG }}" \
            --name "${{ vars.TFSTATE_SA }}" \
            --default-action Deny \
            --output none || true
          echo "state SA: defaultAction=Deny restored"

