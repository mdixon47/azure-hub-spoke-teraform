name: terraform-ci

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tfvars.example"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"
  push:
    branches: [main]
    paths:
      - "**/*.tf"

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: "1.9.5"
  TFLINT_VERSION: "v0.52.0"
  TF_IN_AUTOMATION: "true"
  # Opt JS actions (checkout, download-artifact, etc.) into Node.js 24 to
  # silence the Node.js 20 deprecation warning. Node 20 is removed from
  # GitHub-hosted runners on 2026-09-16.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -recursive -check -diff

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: tflint --init
      - run: tflint --recursive --config="$(pwd)/.tflint.hcl" --format=compact

  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    needs: [fmt, validate, tflint]
    if: github.event_name == 'pull_request'
    environment: dev
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: azure/login@v3
        with:
          auth-type: OIDC
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Detect runner public IP
        id: runner-ip
        run: echo "ip=$(curl -fsSL https://api.ipify.org)" >> "$GITHUB_OUTPUT"
      - name: Allow runner IP on state SA firewall
        run: |
          az storage account network-rule add \
            --resource-group "${{ vars.TFSTATE_RG }}" \
            --account-name "${{ vars.TFSTATE_SA }}" \
            --ip-address "${{ steps.runner-ip.outputs.ip }}" \
            --output none
          # Azure Storage has multiple front-end IPs behind the public
          # endpoint; firewall rules propagate to each independently. A
          # single passing probe is normally sufficient because the
          # follow-on `terraform init` already retries 3× with 15s backoff,
          # which absorbs any late-propagating front-end. Capped at 360s
          # total.
          required=1
          streak=0
          err_file=$(mktemp)
          for i in $(seq 1 72); do
            if az storage blob list \
                 --auth-mode login \
                 --account-name "${{ vars.TFSTATE_SA }}" \
                 --container-name "${{ vars.TFSTATE_CONTAINER }}" \
                 --num-results 1 -o none 2>"$err_file"; then
              streak=$((streak + 1))
              echo "probe $i: ok (streak=$streak/$required)"
              [ "$streak" -ge "$required" ] && { echo "firewall+RBAC stable after $((i*5))s"; exit 0; }
            else
              streak=0
              first_line=$(head -1 "$err_file" 2>/dev/null | tr -d '\r\n' | cut -c1-200)
              echo "probe $i: fail (streak reset): ${first_line:-no-stderr}"
            fi
            sleep 5
          done
          echo "::error::SA firewall did not stabilise within 360s; last error: $(head -3 "$err_file" 2>/dev/null)"
          exit 1
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init
        # Defense in depth: even after a stable probe, occasional 403s
        # have been seen on the first init attempt. Retry up to 3 times.
        run: |
          for attempt in 1 2 3; do
            if terraform init \
                 -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
                 -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
                 -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
                 -backend-config="key=dev.terraform.tfstate"; then
              exit 0
            fi
            echo "terraform init attempt $attempt failed; waiting 15s"
            sleep 15
          done
          echo "::error::terraform init failed after 3 attempts"
          exit 1
      - name: terraform plan
        env:
          TF_VAR_vm_admin_password: ${{ secrets.VM_ADMIN_PASSWORD }}
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
          TF_VAR_vm_admin_ssh_public_key: ${{ secrets.VM_ADMIN_SSH_PUBLIC_KEY }}
        run: terraform plan -input=false -no-color -out=tfplan
      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ github.run_id }}
          path: tfplan
          retention-days: 7
          if-no-files-found: error
      - name: Remove runner IP from state SA firewall
        if: always() && steps.runner-ip.outputs.ip != ''
        run: |
          az storage account network-rule remove \
            --resource-group "${{ vars.TFSTATE_RG }}" \
            --account-name "${{ vars.TFSTATE_SA }}" \
            --ip-address "${{ steps.runner-ip.outputs.ip }}" \
            --output none || true

  infracost:
    name: cost estimate
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: infracost/actions/setup@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Generate cost estimate
        run: |
          infracost breakdown \
            --path=. \
            --format=json \
            --out-file=/tmp/infracost.json
      - name: Post PR comment
        run: |
          infracost comment github \
            --path=/tmp/infracost.json \
            --repo=${{ github.repository }} \
            --github-token=${{ secrets.GITHUB_TOKEN }} \
            --pull-request=${{ github.event.pull_request.number }} \
            --behavior=update
