name: terraform-apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, prod]
      auto_approve:
        description: "Apply without manual review prompt"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.5"
  TF_IN_AUTOMATION: "true"
  # Opt JS actions (checkout, download-artifact, etc.) into Node.js 24 to
  # silence the Node.js 20 deprecation warning. Node 20 is removed from
  # GitHub-hosted runners on 2026-09-16.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  plan:
    name: plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: azure/login@v3
        with:
          auth-type: OIDC
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Detect runner public IP
        id: runner-ip
        run: echo "ip=$(curl -fsSL https://api.ipify.org)" >> "$GITHUB_OUTPUT"
      - name: Allow runner IP on state SA firewall
        run: |
          az storage account network-rule add \
            --resource-group "${{ vars.TFSTATE_RG }}" \
            --account-name "${{ vars.TFSTATE_SA }}" \
            --ip-address "${{ steps.runner-ip.outputs.ip }}" \
            --output none
          required=1
          streak=0
          err_file=$(mktemp)
          for i in $(seq 1 72); do
            if az storage blob list \
                 --auth-mode login \
                 --account-name "${{ vars.TFSTATE_SA }}" \
                 --container-name "${{ vars.TFSTATE_CONTAINER }}" \
                 --num-results 1 -o none 2>"$err_file"; then
              streak=$((streak + 1))
              echo "probe $i: ok (streak=$streak/$required)"
              [ "$streak" -ge "$required" ] && { echo "firewall+RBAC stable after $((i*5))s"; exit 0; }
            else
              streak=0
              first_line=$(head -1 "$err_file" 2>/dev/null | tr -d '\r\n' | cut -c1-200)
              echo "probe $i: fail (streak reset): ${first_line:-no-stderr}"
            fi
            sleep 5
          done
          echo "::error::SA firewall did not stabilise within 360s; last error: $(head -3 "$err_file" 2>/dev/null)"
          exit 1
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init
        run: |
          for attempt in 1 2 3; do
            if terraform init \
                 -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
                 -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
                 -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
                 -backend-config="key=${{ inputs.environment }}.terraform.tfstate"; then
              exit 0
            fi
            echo "terraform init attempt $attempt failed; waiting 15s"
            sleep 15
          done
          echo "::error::terraform init failed after 3 attempts"
          exit 1
      - name: terraform plan
        env:
          TF_VAR_vm_admin_password: ${{ secrets.VM_ADMIN_PASSWORD }}
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
          TF_VAR_vm_admin_ssh_public_key: ${{ secrets.VM_ADMIN_SSH_PUBLIC_KEY }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -out=tfplan
      - uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ github.run_id }}
          path: tfplan
          retention-days: 14
          if-no-files-found: error
      - name: Remove runner IP from state SA firewall
        if: always() && steps.runner-ip.outputs.ip != ''
        run: |
          az storage account network-rule remove \
            --resource-group "${{ vars.TFSTATE_RG }}" \
            --account-name "${{ vars.TFSTATE_SA }}" \
            --ip-address "${{ steps.runner-ip.outputs.ip }}" \
            --output none || true

  apply:
    name: apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: plan
    # Use a separate "<env>-apply" GitHub environment with required reviewers
    # for staging/prod; manual approval gates execution.
    environment: ${{ inputs.environment }}-apply
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: azure/login@v3
        with:
          auth-type: OIDC
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Detect runner public IP
        id: runner-ip
        run: echo "ip=$(curl -fsSL https://api.ipify.org)" >> "$GITHUB_OUTPUT"
      - name: Allow runner IP on state SA firewall
        run: |
          az storage account network-rule add \
            --resource-group "${{ vars.TFSTATE_RG }}" \
            --account-name "${{ vars.TFSTATE_SA }}" \
            --ip-address "${{ steps.runner-ip.outputs.ip }}" \
            --output none
          required=1
          streak=0
          err_file=$(mktemp)
          for i in $(seq 1 72); do
            if az storage blob list \
                 --auth-mode login \
                 --account-name "${{ vars.TFSTATE_SA }}" \
                 --container-name "${{ vars.TFSTATE_CONTAINER }}" \
                 --num-results 1 -o none 2>"$err_file"; then
              streak=$((streak + 1))
              echo "probe $i: ok (streak=$streak/$required)"
              [ "$streak" -ge "$required" ] && { echo "firewall+RBAC stable after $((i*5))s"; exit 0; }
            else
              streak=0
              first_line=$(head -1 "$err_file" 2>/dev/null | tr -d '\r\n' | cut -c1-200)
              echo "probe $i: fail (streak reset): ${first_line:-no-stderr}"
            fi
            sleep 5
          done
          echo "::error::SA firewall did not stabilise within 360s; last error: $(head -3 "$err_file" 2>/dev/null)"
          exit 1
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ github.run_id }}
      - name: terraform init
        run: |
          for attempt in 1 2 3; do
            if terraform init \
                 -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
                 -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
                 -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
                 -backend-config="key=${{ inputs.environment }}.terraform.tfstate"; then
              exit 0
            fi
            echo "terraform init attempt $attempt failed; waiting 15s"
            sleep 15
          done
          echo "::error::terraform init failed after 3 attempts"
          exit 1
      - name: terraform apply
        run: terraform apply -input=false -no-color tfplan
      - name: Remove runner IP from state SA firewall
        if: always() && steps.runner-ip.outputs.ip != ''
        run: |
          az storage account network-rule remove \
            --resource-group "${{ vars.TFSTATE_RG }}" \
            --account-name "${{ vars.TFSTATE_SA }}" \
            --ip-address "${{ steps.runner-ip.outputs.ip }}" \
            --output none || true
