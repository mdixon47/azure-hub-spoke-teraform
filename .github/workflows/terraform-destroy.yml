name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        type: choice
        options: [dev, staging, prod]
      confirm:
        description: "Type the environment name exactly to confirm destruction"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.5"
  TF_IN_AUTOMATION: "true"

jobs:
  guard:
    name: guard (${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation phrase matches environment
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "::error::Confirmation phrase '${{ inputs.confirm }}' does not match environment '${{ inputs.environment }}'."
            exit 1
          fi
          echo "Confirmation accepted: destroying ${{ inputs.environment }}."

  destroy:
    name: destroy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: guard
    environment: ${{ inputs.environment }}-apply
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Detect runner public IP
        id: runner-ip
        run: echo "ip=$(curl -fsSL https://api.ipify.org)" >> "$GITHUB_OUTPUT"
      - name: Allow runner IP on state SA firewall
        run: |
          az storage account network-rule add \
            --resource-group "${{ vars.TFSTATE_RG }}" \
            --account-name "${{ vars.TFSTATE_SA }}" \
            --ip-address "${{ steps.runner-ip.outputs.ip }}" \
            --output none
          required=3
          streak=0
          for i in $(seq 1 36); do
            if az storage blob list \
                 --auth-mode login \
                 --account-name "${{ vars.TFSTATE_SA }}" \
                 --container-name "${{ vars.TFSTATE_CONTAINER }}" \
                 --num-results 1 -o none 2>/dev/null; then
              streak=$((streak + 1))
              echo "probe $i: ok (streak=$streak/$required)"
              [ "$streak" -ge "$required" ] && { echo "firewall+RBAC stable after $((i*5))s"; exit 0; }
            else
              streak=0
              echo "probe $i: fail (streak reset)"
            fi
            sleep 5
          done
          echo "::error::SA firewall did not stabilise within 180s"
          exit 1
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init
        run: |
          for attempt in 1 2 3; do
            if terraform init \
                 -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
                 -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
                 -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
                 -backend-config="key=${{ inputs.environment }}.terraform.tfstate"; then
              exit 0
            fi
            echo "terraform init attempt $attempt failed; waiting 15s"
            sleep 15
          done
          echo "::error::terraform init failed after 3 attempts"
          exit 1
      - name: terraform destroy
        env:
          TF_VAR_vm_admin_password: ${{ secrets.VM_ADMIN_PASSWORD }}
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
          TF_VAR_vm_admin_ssh_public_key: ${{ secrets.VM_ADMIN_SSH_PUBLIC_KEY }}
        run: |
          terraform destroy \
            -input=false \
            -no-color \
            -auto-approve \
            -var-file="environments/${{ inputs.environment }}.tfvars"
      - name: Remove runner IP from state SA firewall
        if: always() && steps.runner-ip.outputs.ip != ''
        run: |
          az storage account network-rule remove \
            --resource-group "${{ vars.TFSTATE_RG }}" \
            --account-name "${{ vars.TFSTATE_SA }}" \
            --ip-address "${{ steps.runner-ip.outputs.ip }}" \
            --output none || true
