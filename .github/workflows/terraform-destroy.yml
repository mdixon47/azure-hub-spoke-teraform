name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        type: choice
        options: [dev, staging, prod]
      confirm:
        description: "Type the environment name exactly to confirm destruction"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.5"
  TF_IN_AUTOMATION: "true"
  # Opt JS actions (checkout, download-artifact, etc.) into Node.js 24 to
  # silence the Node.js 20 deprecation warning. Node 20 is removed from
  # GitHub-hosted runners on 2026-09-16.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  guard:
    name: guard (${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation phrase matches environment
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "::error::Confirmation phrase '${{ inputs.confirm }}' does not match environment '${{ inputs.environment }}'."
            exit 1
          fi
          echo "Confirmation accepted: destroying ${{ inputs.environment }}."

  destroy:
    name: destroy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: guard
    environment: ${{ inputs.environment }}-apply
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Open state SA for terraform
        run: |
          az storage account update \
            --resource-group "${{ vars.TFSTATE_RG }}" \
            --name "${{ vars.TFSTATE_SA }}" \
            --default-action Allow \
            --output none
          echo "state SA: defaultAction=Allow"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init
        run: |
          for attempt in 1 2 3; do
            if terraform init \
                 -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
                 -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
                 -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
                 -backend-config="key=${{ inputs.environment }}.terraform.tfstate"; then
              exit 0
            fi
            echo "terraform init attempt $attempt failed; waiting 15s"
            sleep 15
          done
          echo "::error::terraform init failed after 3 attempts"
          exit 1
      - name: terraform destroy
        env:
          TF_VAR_vm_admin_password: ${{ secrets.VM_ADMIN_PASSWORD }}
          TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
          TF_VAR_vm_admin_ssh_public_key: ${{ secrets.VM_ADMIN_SSH_PUBLIC_KEY }}
        run: |
          terraform destroy \
            -input=false \
            -no-color \
            -auto-approve \
            -var-file="environments/${{ inputs.environment }}.tfvars"
      - name: Restore state SA firewall
        if: always()
        run: |
          az storage account update \
            --resource-group "${{ vars.TFSTATE_RG }}" \
            --name "${{ vars.TFSTATE_SA }}" \
            --default-action Deny \
            --output none || true
          echo "state SA: defaultAction=Deny restored"
